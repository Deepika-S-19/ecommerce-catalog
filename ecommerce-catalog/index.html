<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Store</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->

    <header>

        <nav class="navbar">

            <h2>ShopEasy</h2>

            <ul>

                <li><a href="#">Home</a></li>

                <li><a href="products.html">Products</a></li>

                <li><a href="cart.html">Cart</a></li>

                <li><a href="about.html">About</a></li>

                <li><a href="contact.html">Contact</a></li>

            </ul>
            <button id="themeBtn">
🌙
</button>

        </nav>

    </header>

    <!-- Hero Section -->

    <section class="hero">

        <h1>Welcome to ShopEasy</h1>

        <p>Your One Stop Shopping Destination</p>

        <button onclick="location.href='products.html'">
            Shop Now
        </button>

    </section>

    <!-- Featured Products -->

    <section class="featured">

        <h2>Featured Products</h2>

        <div class="product-container">

            <div class="card">

<img 
src="assets/images/laptop.webp"
loading="lazy"
alt="Laptop">
                <h3>Laptop</h3>

                <p>$799</p>

            </div>

            <div class="card">

<img 
src="assets/images/headphone.webp"
loading="lazy"
alt="Headphones">
                <h3>Headphones</h3>

                <p>$99</p>

            </div>

            <div class="card">

<img 
src="assets/images/mobile.webp"
loading="lazy"
alt="Mobile">
                <h3>Mobile</h3>

                <p>$499</p>

            </div>

        </div>

    </section>

<script src="js/app.js"></script>

</body>

</html>
